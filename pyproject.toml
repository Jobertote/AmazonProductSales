[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazonProductSales"
version = "0.1.0"
description = "Análisis de ventas de Amazon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88